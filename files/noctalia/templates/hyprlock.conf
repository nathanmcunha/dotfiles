general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot
    color = rgba({{colors.surface.default.hex}}, 1.0)
    blur_passes = 2
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    outer_color = rgb({{colors.primary.default.hex}})
    inner_color = rgb({{colors.surface_container.default.hex}})
    font_color = rgb({{colors.on_surface.default.hex}})
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i>
    position = 0, -20
    halign = center
    valign = center
}
